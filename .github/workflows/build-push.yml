# Builds the container image (model weights baked in), smoke-tests it under the
# production resource limits, and pushes it to ECR.
#
# Required repository configuration:
#   - Repo variable  AWS_REGION          e.g. eu-west-1
#   - Repo variable  ECR_REPOSITORY      e.g. pii-detector
#   - Repo secret    AWS_ROLE_TO_ASSUME  IAM role ARN trusted for GitHub OIDC,
#     with ecr:GetAuthorizationToken plus push/pull on that one repository
#
# Security posture: every third-party action is pinned to a full commit SHA
# (Dependabot keeps them current), auth is OIDC (no long-lived AWS keys),
# permissions are least-privilege, and dynamic values reach `run:` via env.
name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements*.txt"
      - "scripts/download_model.py"
      - ".github/workflows/build-push.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC federation to AWS
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            --tag "$REGISTRY/$REPOSITORY:latest" \
            .

      - name: Smoke test image (boots under prod limits, /health and /detect work)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run --rm --detach --name pii-smoke \
            --memory=4g --cpus=1 \
            -e API_KEY=smoke-test-key \
            -p 8000:8000 \
            "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

          status=""
          for _ in $(seq 1 60); do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)"
            [ "$status" = "200" ] && break
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "service never became healthy (last /health status: $status)"
            docker logs pii-smoke
            exit 1
          fi

          curl -sf -X POST http://localhost:8000/detect \
            -H 'Content-Type: application/json' \
            -H 'X-API-Key: smoke-test-key' \
            -d '{"text": "Mario Rossi, mario@test.com"}' | grep -q '"email"'

          docker stop pii-smoke

      - name: Push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"
