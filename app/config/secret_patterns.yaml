# Vendor secret/token patterns for the regex detector. Grow this list here —
# never hardcode new key formats in Python.
#
# Each entry:
#   name:  unique identifier, for maintenance only (never appears in responses)
#   label: entity type emitted (api_key | secret | access_token; any string works,
#          but a label is only scanned when a request asks for it)
#   regex: Python `re` pattern, matched with finditer on the raw text
#   group: optional capture-group number whose span becomes the entity
#          (default 0 = the whole match)
#
# The file is read once at process startup; a bad regex fails startup loudly.
# Path is overridable with the SECRET_PATTERNS_PATH environment variable.
patterns:
  - name: aws_access_key_id
    label: api_key
    regex: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'

  - name: openai_api_key
    label: api_key
    regex: '\bsk-[A-Za-z0-9_-]{20,}\b'

  - name: google_api_key
    label: api_key
    regex: '\bAIza[0-9A-Za-z_-]{35}\b'

  - name: stripe_live_key
    label: api_key
    regex: '\b[rs]k_live_[0-9a-zA-Z]{16,}\b'

  - name: github_token
    label: access_token
    regex: '\bgh[pousr]_[A-Za-z0-9]{36,255}\b'

  - name: gitlab_pat
    label: access_token
    regex: '\bglpat-[A-Za-z0-9_-]{20,}\b'

  - name: slack_token
    label: access_token
    regex: '\bxox[baprs]-[A-Za-z0-9-]{10,}\b'

  - name: jwt
    label: access_token
    regex: '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'

  - name: private_key_block
    label: secret
    regex: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY(?: BLOCK)?-----'

  # Catches `password = "..."` / `api_key: ...` style assignments; the capture
  # group makes the entity span cover only the secret value itself.
  - name: generic_assignment
    label: secret
    regex: '(?i)\b(?:api[_-]?key|secret|token|passwd|password)\b["'']?\s*[:=]\s*["'']?([A-Za-z0-9_\-/+=.]{16,})'
    group: 1
